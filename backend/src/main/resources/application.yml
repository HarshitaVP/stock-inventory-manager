spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: app
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics